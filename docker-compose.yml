# Alternative: Direct Docker Compose deployment (optional, without DSCI)
# Usage: docker-compose up -d

version: '3.8'

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    networks:
      - llm-mvp
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    networks:
      - llm-mvp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: mvp_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    networks:
      - llm-mvp
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

  mvp-backend:
    build:
      context: ./mvp-app
      dockerfile: Dockerfile
    container_name: mvp-backend
    restart: always
    networks:
      - llm-mvp
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/mvp_db
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    networks:
      - llm-mvp
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - open-webui
      - mvp-backend

networks:
  llm-mvp:
    driver: bridge

volumes:
  ollama-models:
  postgres-data:
  webui-data:
